name: Embutido — fallback do dashboard

# Regrava o dado embutido do index.html (const DATA / SNAP.cirad) a partir das
# mesmas views que a tela lê ao vivo. Sem isso o fallback envelhece calado: em
# 18/08/2026 ele mostrava a S31 do CIRAD com o banco já na S33.
# Roda depois dos ETLs do dia. Só commita se algo mudou.

on:
  schedule:
    # 14:00 UTC = 11:00 BRT, segunda a sábado (depois de preços, origens e Europa)
    - cron: '0 14 * * 1-6'
  workflow_dispatch:

concurrency:
  group: embutido
  cancel-in-progress: false

jobs:
  embutido:
    name: Regerar fallback embutido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install requests

      - name: Gerar embutido
        run: python gerar_embutido.py

      - name: Conferir HTML
        run: |
          for f in index.html bi_avocado.html; do
            n=$(grep -c '</html>' "$f"); [ "$n" = "1" ] || { echo "::error::$f com $n </html>"; exit 1; }
          done

      - name: Commit se mudou
        run: |
          if git diff --quiet -- index.html bi_avocado.html bi_avocado_data.json; then
            echo "Embutido já estava em dia."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bi_avocado.html bi_avocado_data.json
          git commit -m "embutido: fallback regerado do Supabase ($(date -u +%Y-%m-%d))"
          git push

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prefixo = 'Falha Embutido';
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'etl-falha' });
            const ja = abertas.data.find(i => i.title.startsWith(prefixo));
            if (ja) {
              await github.rest.issues.createComment({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: ja.number, body: `Falhou de novo: ${run}` });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `${prefixo} — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`,
              labels: ['etl-falha', 'embutido'],
              body: ['**Job:** gerar_embutido.py (fallback do dashboard)', '',
                     'O dashboard continua lendo o Supabase ao vivo; só o fallback ficou parado.', '',
                     `**Run:** ${run}`].join('\n'),
            });
