name: ETL Preços Europa — CIRAD

# O relatório da CIRAD chega por e-mail (Microsoft 365) e não tem API — já
# perguntado ao fornecedor. Um flow do Power Automate deposita o PDF numa pasta
# do ownCloud e este job lê por WebDAV.
#
# Nenhuma credencial de e-mail entra aqui: o Actions só conhece o WebDAV.
#
# São dois jobs em sequência sobre o MESMO PDF:
#   europa  → preço de referência e grade por calibre (números)
#   resumo  → o resumo executivo (prosa), que CITA aqueles números
# O segundo depende do primeiro de propósito: o etl_cirad_resumo.py se recusa a
# escrever sobre uma semana que não está em europa_cirad_precos, então rodar
# fora de ordem só produziria uma falha com log pior.
#
# O job de preço precisa de tesseract-ocr. Motivo: o número oficial de cada
# semana está nos RÓTULOS DO GRÁFICO DE BARRAS, que é imagem raster no PDF. A
# tabela de texto da página 1 existe, mas em 12/08/2026 ela veio com o rótulo de
# semana uma semana atrasado — o gráfico é a fonte confiável porque traz a
# semana ao lado de cada número. O ETL cruza os dois e avisa quando divergem.
#
# Roda todo dia útil de propósito: o relatório é semanal mas o dia de chegada
# varia. O upsert é idempotente na chave (ano, semana, grade).

on:
  schedule:
    # 13:30 UTC = 10:30 BRT, de segunda a sexta.
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só mostrar o que faria, sem gravar no Supabase'
        type: boolean
        required: false
        default: false
      todos:
        description: 'Processar a pasta inteira (backfill do histórico)'
        type: boolean
        required: false
        default: false
      refazer_resumo:
        description: 'Regerar o resumo mesmo se a semana já estiver no banco'
        type: boolean
        required: false
        default: false

concurrency:
  group: etl-europa-cirad
  cancel-in-progress: false

jobs:
  europa:
    name: Europa (CIRAD / FruiTrop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      OWNCLOUD_URL:     ${{ secrets.OWNCLOUD_URL }}
      OWNCLOUD_PASTA:   ${{ secrets.OWNCLOUD_PASTA }}
      OWNCLOUD_USER:    ${{ secrets.OWNCLOUD_USER }}
      OWNCLOUD_PASS:    ${{ secrets.OWNCLOUD_PASS }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar tesseract-ocr
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          tesseract --version | head -1

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Conferir secrets
        run: |
          faltando=""
          for v in SUPABASE_URL SUPABASE_KEY OWNCLOUD_URL OWNCLOUD_PASTA OWNCLOUD_USER OWNCLOUD_PASS; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::secrets não configurados:$faltando"
            exit 1
          fi

      - name: ETL Europa CIRAD
        id: etl
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ inputs.todos }}" = "true" ]; then args="$args --todos"; fi
          python etl_europa_cirad.py $args

      - name: Resumo
        if: always()
        run: |
          echo "### Europa (CIRAD / FruiTrop)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Resultado: \`${{ steps.etl.outcome }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Falha ETL Europa CIRAD — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const corpo = [
              '**ETL:** Europa CIRAD → Supabase `europa_cirad_precos` e `europa_cirad_calibre`',
              `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Causas mais comuns, em ordem de probabilidade:',
              '1. O flow do Power Automate parou e não há PDF novo na pasta do ownCloud.',
              '2. Credencial do WebDAV expirada (senha de aplicativo revogada).',
              '3. A CIRAD mudou o layout. O log diz qual etapa falhou:',
              '   "não achei AVOCADO REPORT WEEK", "gráfico de X não localizado",',
              '   "página 4 sem a grade de calibres".',
              '4. OCR sem consenso: o log mostra a votação por semana. Se muitas',
              '   semanas saírem sem consenso, provavelmente o gráfico mudou de',
              '   tamanho ou de posição na página.',
              '5. Preço fora da faixa de sanidade (3–40 €/caixa, 0,5–8 €/kg):',
              '   erro de leitura, não de mercado. Conferir o PDF na mão.',
              '',
              'Para reproduzir local com um PDF baixado à mão:',
              '`python etl_europa_cirad.py --arquivo "CIRAD avocado report Week NN-AAAA.pdf" --dry-run`',
              '',
              'Para diagnosticar sem OCR (só as tabelas de texto):',
              '`python etl_europa_cirad.py --arquivo "..." --sem-ocr --dry-run`',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: corpo,
              labels: ['etl-falha', 'precos'],
            });

  resumo:
    name: Resumo executivo (CIRAD / Tropisens)
    needs: europa
    # Não roda no backfill: --todos processa a pasta inteira, e gerar resumo de
    # 119 boletins antigos custa dinheiro e não serve a ninguém — a tela mostra
    # só a semana corrente.
    if: needs.europa.result == 'success' && inputs.todos != 'true' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      OWNCLOUD_URL:     ${{ secrets.OWNCLOUD_URL }}
      OWNCLOUD_PASTA:   ${{ secrets.OWNCLOUD_PASTA }}
      OWNCLOUD_USER:    ${{ secrets.OWNCLOUD_USER }}
      OWNCLOUD_PASS:    ${{ secrets.OWNCLOUD_PASS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODELO:  ${{ vars.ANTHROPIC_MODELO }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      # Sem a chave, o job termina verde avisando — não falha. Enquanto o
      # secret não existir, o preço continua entrando todo dia e só o resumo
      # fica parado; um job vermelho todo dia treinaria a gente a ignorar
      # e-mail de falha.
      #
      # A chave é da Anthropic (sk-ant-...). O Tropisens.py usava OpenAI porque
      # foi escrito antes de a casa ter Claude; manter duas contas de API vivas
      # para uma chamada por semana não se justificava.
      - name: Conferir ANTHROPIC_API_KEY
        id: chave
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "tem=nao" >> $GITHUB_OUTPUT
            echo "::warning::ANTHROPIC_API_KEY não configurada — resumo não gerado."
            echo "### Resumo executivo" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pulado: falta o secret \`ANTHROPIC_API_KEY\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "tem=sim" >> $GITHUB_OUTPUT
          fi

      - name: Gerar resumo
        id: etl
        if: steps.chave.outputs.tem == 'sim'
        run: |
          args=""
          if [ "${{ inputs.refazer_resumo }}" = "true" ]; then args="$args --forcar"; fi
          python etl_cirad_resumo.py $args

      - name: Resumo do job
        if: always() && steps.chave.outputs.tem == 'sim'
        run: |
          echo "### Resumo executivo (CIRAD / Tropisens)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Resultado: \`${{ steps.etl.outcome }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Falha resumo CIRAD — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const corpo = [
              '**ETL:** Resumo executivo → Supabase `cirad_resumo`',
              `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'O resumo é o único dado do projeto escrito por um modelo de linguagem,',
              'e as travas existem para ele não contradizer a aba de preços.',
              'Causas, em ordem de probabilidade:',
              '',
              '1. **Cifra que não está no banco.** O log lista o valor citado e as',
              '   cifras aceitas da semana. Nada foi gravado. Rodar de novo costuma',
              '   resolver; se repetir, o prompt ou o bloco de números está errado.',
              '2. **Menos de 3 seções reconhecidas** — a saída fugiu do formato de',
              '   cinco cabeçalhos `## `. O log traz o começo da resposta.',
              '3. **Preço da semana ausente em `europa_cirad_precos`.** O job de',
              '   preço passou mas não gravou aquela edição. Conferir o job acima.',
              '4. Chave da Anthropic sem crédito, expirada ou modelo indisponível.',
              '',
              'Para reproduzir local:',
              '`python etl_cirad_resumo.py --arquivo "CIRAD avocado report Week NN-AAAA.pdf" --dry-run --forcar`',
              '',
              'Para ver só os números que o modelo receberia, sem gastar chamada:',
              '`python etl_cirad_resumo.py --arquivo "..." --sem-modelo`',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: corpo,
              labels: ['etl-falha', 'resumo'],
            });
