<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BI Avocado &mdash; TFruits</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

  /* ── RESET & TOKENS ──────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ── TFruits brand colors ── */
    --green:        #8DC63F;   /* verde do T quadrado */
    --green-light:  #A5D95C;
    --green-dim:    rgba(141,198,63,.13);
    --green-border: rgba(141,198,63,.28);
    --orange:       #F47C20;   /* laranja Fruits */
    --orange-dim:   rgba(244,124,32,.13);
    --orange-border:rgba(244,124,32,.30);
    /* ── backgrounds ── */
    --bg:           #000000;
    --bg2:          #0A0A0A;
    --surface:      #111111;
    --surface2:     #1A1A1A;
    --border:       rgba(255,255,255,.11);
    --border-green: rgba(141,198,63,.18);
    /* Hierarquia de texto — contraste sobre --bg (mín. 4,5:1 para texto pequeno) */
    --text:         #FFFFFF;  /* 17,3:1 — títulos e valores */
    --text-2:       #ADADAD;  /* 6,6:1  — descrições e apoio */
    --text-3:       #909090;  /* 5,7:1  — rótulos, metadados, cabeçalhos de tabela */
    --radius-card:  1.5rem;
    --radius-inner: calc(1.5rem - 4px);
    --font:         'Plus Jakarta Sans', sans-serif;
    --ease-spring:  cubic-bezier(0.32, 0.72, 0, 1);
  }

  html { font-size: 90%; } /* visual compacto (equivalente a zoom 90%) sem usar CSS zoom — zoom quebra clique de legenda no Chart.js */
  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow-x: hidden; }

  /* ── SCROLLBAR ───────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  /* ── LAYOUT ──────────────────────────────────────────────────── */
  .app { display: flex; min-height: 100dvh; }

  /* ── SIDEBAR ─────────────────────────────────────────────────── */
  .sidebar {
    width: 198px; min-width: 198px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 1.5rem 1rem;
    position: sticky; top: 0; height: 100dvh;
    transition: transform .4s var(--ease-spring);
    z-index: 100;
  }

  .sidebar-logo {
    display: flex; align-items: center; gap: .6rem;
    padding: .6rem .75rem 1.5rem;
  }
  .logo-dot {
    width: 25px; height: 25px; border-radius: 8px;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #0A0D0A;
    flex-shrink: 0;
  }
  .logo-text { font-size: .8rem; font-weight: 700; letter-spacing: .05em; color: var(--text); line-height: 1.2; }
  .logo-sub  { font-size: .65rem; color: var(--text-2); font-weight: 400; }

  .nav-section { font-size: .6rem; font-weight: 600; letter-spacing: .15em; color: var(--text-3); text-transform: uppercase; padding: 0 .75rem .5rem; margin-top: .25rem; }

  .nav-item {
    display: flex; align-items: center; gap: .6rem;
    padding: .55rem .75rem; border-radius: .75rem; cursor: pointer;
    font-size: .78rem; font-weight: 500; color: var(--text-2);
    transition: all .25s var(--ease-spring);
    margin-bottom: .1rem; user-select: none;
  }
  .nav-item:hover { background: var(--green-dim); color: var(--green-light); }
  .nav-item.active { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
  .nav-icon { width: 14px; height: 14px; opacity: .7; flex-shrink: 0; }
  .nav-item.active .nav-icon { opacity: 1; }

  .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: .4rem; box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .status-label { font-size: .65rem; color: var(--text-2); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── MAIN ────────────────────────────────────────────────────── */
  .main { flex: 1; overflow-y: auto; padding: 2rem 2rem 3rem; min-width: 0; }

  /* ── PAGE HEADER ─────────────────────────────────────────────── */
  .page-header { margin-bottom: 2rem; opacity: 0; transform: translateY(12px); animation: fadeUp .5s var(--ease-spring) .05s forwards; }
  .page-eyebrow {
    display: inline-flex; align-items: center; gap: .4rem;
    font-size: .6rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--green); background: var(--green-dim); border: 1px solid var(--green-border);
    padding: .25rem .65rem; border-radius: 99px; margin-bottom: .75rem;
  }
  .page-title { font-size: 1.6rem; font-weight: 700; color: var(--text); line-height: 1.2; }
  .page-sub   { font-size: .8rem; color: var(--text-2); margin-top: .3rem; }
  .region-title { font-size: .78rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .08em; margin: 1.5rem 0 .6rem; }
  .region-title:first-of-type { margin-top: .5rem; }

  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  /* ── CARDS GRID ──────────────────────────────────────────────── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(162px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }

  /* ── CARD (double-bezel) ─────────────────────────────────────── */
  .card-shell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 3px;
    transition: border-color .3s var(--ease-spring), transform .3s var(--ease-spring);
    opacity: 0; transform: translateY(16px);
    animation: fadeUp .5s var(--ease-spring) forwards;
  }
  .card-shell:hover { border-color: var(--border-green); transform: translateY(-2px); }

  .card-inner {
    background: var(--surface2);
    border-radius: var(--radius-inner);
    padding: 1.25rem 1.4rem;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.04);
    height: 100%;
  }

  .kpi-label  { font-size: .65rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: .5rem; }
  .kpi-value  { font-size: 1.6rem; font-weight: 700; color: var(--text); line-height: 1; word-break: break-word; }
  .kpi-value-sm { font-size: 1rem !important; line-height: 1.3; }
  /* Códigos (NCM, etc.): nunca quebram linha — "0805.50.00" partido em duas
     linhas deixa de ser um código legível. */
  .kpi-value-code { font-size: 1.25rem !important; white-space: nowrap; word-break: normal; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .kpi-unit   { font-size: .7rem; color: var(--text-2); margin-top: .2rem; }
  .kpi-trend  { display: inline-flex; align-items: center; gap: .2rem; font-size: .65rem; font-weight: 600; margin-top: .4rem; padding: .15rem .4rem; border-radius: 99px; }
  .kpi-trend.up   { color: var(--green); background: var(--green-dim); }
  .kpi-trend.down { color: #EF5350; background: rgba(239,83,80,.12); }

  /* ── CHART CARD ──────────────────────────────────────────────── */
  .chart-card { margin-bottom: 1.5rem; }
  .chart-card .card-inner { padding: 1.4rem; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; flex-wrap: wrap; gap: .5rem; }
  .chart-title { font-size: .9rem; font-weight: 600; color: var(--text); }
  .chart-wrap  { position: relative; height: 234px; }

  /* ── FILTER BAR ──────────────────────────────────────────────── */
  .filter-bar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .filter-chip {
    font-size: .7rem; font-weight: 500; padding: .3rem .7rem; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-2); background: transparent;
    transition: all .2s var(--ease-spring);
  }
  .filter-chip:hover  { border-color: var(--orange-border); color: var(--orange); }
  .filter-chip.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

  /* ── SELECT ──────────────────────────────────────────────────── */
  .styled-select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-2);
    font-family: var(--font); font-size: .72rem; padding: .3rem .6rem; border-radius: .5rem;
    cursor: pointer; outline: none;
    transition: border-color .2s;
  }
  .styled-select:focus { border-color: var(--green-border); }
  .styled-select option { background: var(--surface2); }

  /* ── TABLE ───────────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .75rem; }
  th { padding: .6rem .9rem; text-align: left; font-size: .6rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: .55rem .9rem; border-bottom: 1px solid rgba(255,255,255,.03); color: var(--text-2); white-space: nowrap; }
  tr:hover td { background: var(--green-dim); color: var(--text); }

  /* Tabela país × mês (Share Brasil): cada mês tem que ser lido sem ambiguidade.
     Números à direita, régua vertical entre meses, coluna País ancorada na
     rolagem horizontal e coluna Total destacada como fechamento da linha. */
  table.table-mes td, table.table-mes th { border-right: 1px solid rgba(255,255,255,.05); }
  table.table-mes .col-mes, table.table-mes .col-num { text-align: right; font-variant-numeric: tabular-nums; padding-left: .55rem; padding-right: .8rem; }
  table.table-mes .col-mes-vazio { color: var(--text-3); }
  /* Diferenciação das colunas de dado (mês na aba Share, ano na Containers):
     1. faixa zebrada vertical alternada (a coluna vira um bloco);
     2. divisor mais forte marcando fim de trimestre (Mar/Jun/Set/Dez).
     O destaque da semana de referência fica em `tr.linha-ref`, mais abaixo. */
  table.table-mes .col-zebra { background: rgba(255,255,255,.032); }
  table.table-mes thead .col-zebra { background: rgba(255,255,255,.05); }
  table.table-mes .col-tri { border-right: 1px solid rgba(255,255,255,.16); }
  /* O hover da linha tem que vencer a zebra, senão a leitura horizontal some. */
  table.table-mes tr:hover td.col-mes,
  table.table-mes tr:hover td.col-num,
  table.table-mes tr:hover td.col-total { background: var(--green-dim); color: var(--text); }
  /* Mês em foco: passar o mouse no número acende a coluna inteira. */
  table.table-mes th.col-mes, table.table-mes th.col-num { cursor: default; transition: color .15s, background .15s; }
  table.table-mes th.col-mes.mes-on, table.table-mes th.col-num.mes-on { color: var(--green); background: var(--green-dim); }
  table.table-mes td.col-mes.mes-on, table.table-mes td.col-num.mes-on { background: var(--green-dim); color: var(--text); }
  table.table-mes .col-pais {
    position: sticky; left: 0; z-index: 2; background: var(--surface2);
    font-weight: 500; color: var(--text); max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  table.table-mes thead .col-pais { background: var(--surface2); }
  table.table-mes tr:hover .col-pais { background: var(--green-dim); }
  table.table-mes .col-total { text-align: right; border-right: none; background: rgba(255,255,255,.02); }
  /* Posição vive dentro da célula do país: assim a coluna ancorada na rolagem
     é uma só (duas colunas sticky lado a lado se sobrepõem). */
  table.table-mes .pais-rank {
    display: inline-block; width: 1.1rem; margin-right: .45rem;
    color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 400;
  }
  .chart-note { font-size: .65rem; color: var(--text-3); margin-top: .7rem; line-height: 1.5; }

  /* Tabela que abraça o conteúdo em vez de esticar até a borda do card.
     Com 4 colunas curtas, `width: 100%` gerava colunas enormes e vazias. */
  table.table-compacta th, table.table-compacta td { padding-left: 1rem; padding-right: 1rem; }

  /* Containers: tabela à esquerda no tamanho que precisa, resumo da temporada
     ocupando o espaço que sobra — mesmo arranjo do relatório da fonte. */
  /* Resumo em cima, tabela embaixo, MESMA largura. Cards de larguras
     diferentes empilhados ficam desproporcionais; a coluna é estreita o
     suficiente para as 5 colunas da tabela não virarem faixas vazias. */
  .cont-layout { display: flex; flex-direction: column; gap: 1rem; max-width: 900px; }
  .cont-layout > .card-shell { width: 100%; }

  /* Semana de referência: a mesma que o resumo está usando. Linha inteira
     destacada, como no relatório da fonte. */
  table.table-mes tr.linha-ref td { background: var(--green-dim); color: var(--text); }
  table.table-mes tr.linha-ref .col-pais { background: rgba(141,198,63,.18); color: var(--green); font-weight: 600; }
  /* Resumo como tabela, e não como cards soltos: os anos precisam ficar
     alinhados em coluna para comparar de bater o olho, igual ao relatório. */
  table.resumo { width: 100%; border-collapse: collapse; }
  table.resumo th { padding: .35rem .5rem .5rem; text-align: right; }
  table.resumo th:first-child { text-align: left; }
  table.resumo td { padding: .85rem .5rem; border-bottom: 1px solid rgba(255,255,255,.05); text-align: right; font-variant-numeric: tabular-nums; }
  table.resumo tr:last-child td { border-bottom: none; }
  table.resumo tr:hover td { background: transparent; }
  table.resumo .resumo-rot { text-align: left; color: var(--text-2); white-space: normal; max-width: 190px; line-height: 1.35; }
  table.resumo .resumo-num { font-size: 1.15rem; font-weight: 600; color: var(--text); }
  table.resumo .resumo-var { font-size: .68rem; padding-left: 0; }
  table.resumo .resumo-zebra { background: rgba(255,255,255,.022); }
  table.table-mes tfoot td {
    border-top: 1px solid var(--border); border-bottom: none;
    color: var(--text); font-weight: 600; background: rgba(255,255,255,.02);
  }
  /* A célula sticky não pode ser translúcida (as colunas passariam por baixo);
     #1D221D = --surface2 já com o clareamento de 2% do rodapé aplicado. */
  table.table-mes tfoot .col-pais { background: #1D221D; }

  /* ── TABS (page navigation) ──────────────────────────────────── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── LOADING ─────────────────────────────────────────────────── */
  .loading { display: flex; align-items: center; justify-content: center; height: 144px; color: var(--text-3); font-size: .8rem; gap: .5rem; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CLIMA GRID ──────────────────────────────────────────────── */
  .clima-grid, .cidades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .cidade-card .card-inner { display: flex; flex-direction: column; gap: .3rem; }
  .cidade-nome { font-size: .8rem; font-weight: 600; color: var(--text); }
  .cidade-temp { font-size: 2rem; font-weight: 700; color: var(--green); line-height: 1; }
  .cidade-desc { font-size: .7rem; color: var(--text-2); }
  .cidade-extra { display: flex; gap: .8rem; margin-top: .4rem; }
  .cidade-extra span { font-size: .65rem; color: var(--text-2); }
  .cidade-medicao { font-size: .62rem; color: var(--text-2); margin-top: .45rem; }
  .rain-badge { display:inline-block; margin-top:.4rem; padding:.2rem .5rem; border-radius:4px; font-size:.65rem; font-weight:600; }
  .rain-badge.warn   { background:rgba(245,131,78,.15); color:#F5834E; border:1px solid rgba(245,131,78,.4); }
  .rain-badge.critic { background:rgba(239,83,80,.15);  color:#EF5350; border:1px solid rgba(239,83,80,.4); animation: pulse-rain 1.5s ease-in-out infinite; }
  .cold-badge { display:inline-block; margin-top:.2rem; padding:.2rem .5rem; border-radius:4px; font-size:.65rem; font-weight:600; }
  .cold-badge.warn   { background:rgba(56,189,248,.12); color:#38BDF8; border:1px solid rgba(56,189,248,.35); }
  .cold-badge.critic { background:rgba(129,140,248,.2); color:#818CF8; border:1px solid rgba(129,140,248,.5); animation:pulse-rain 1.5s ease-in-out infinite; }
  .fungal-badge { display:inline-block; margin-top:.2rem; padding:.2rem .5rem; border-radius:4px; font-size:.65rem; font-weight:600; background:rgba(167,139,250,.12); color:#A78BFA; border:1px solid rgba(167,139,250,.4); }
  @keyframes pulse-rain { 0%,100%{opacity:1} 50%{opacity:.6} }

  /* ── MOBILE NAV ──────────────────────────────────────────────── */
  .mobile-bar {
    display: none; position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: rgba(20,25,20,.92); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 99px;
    padding: .5rem .75rem; gap: .25rem; z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .mb-item {
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
    padding: .4rem .6rem; border-radius: 99px; cursor: pointer;
    font-size: .55rem; color: var(--text-3); transition: all .2s;
  }
  .mb-item.active { color: var(--green); background: var(--green-dim); }
  .mb-icon { width: 18px; height: 18px; }

  /* ── RESPONSIVE ──────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .mobile-bar { display: flex; }
    .main { padding: 1.25rem 1rem 5rem; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-wrap { height: 200px; }
    .page-title { font-size: 1.2rem; }
    .clima-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── STAGGER DELAYS ──────────────────────────────────────────── */
  .card-shell:nth-child(1){animation-delay:.05s}
  .card-shell:nth-child(2){animation-delay:.1s}
  .card-shell:nth-child(3){animation-delay:.15s}
  .card-shell:nth-child(4){animation-delay:.2s}
  .card-shell:nth-child(5){animation-delay:.25s}
  .card-shell:nth-child(6){animation-delay:.3s}

  /* ── BADGE ───────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center;
    font-size: .6rem; font-weight: 600; padding: .15rem .45rem; border-radius: 99px;
    background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border);
  }

  /* ── TWO-COL GRID ────────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* ── UPDATE TAG ──────────────────────────────────────────────── */
  #last-update { font-size: .65rem; color: var(--text-3); }

  /* ══ BI AVOCADO — componentes adicionais ══════════════════════ */

  /* MATRIZ / HEATMAP */
  .mtx-wrap { overflow-x: auto; }
  table.mtx { border-collapse: separate; border-spacing: 3px; width: auto; }
  table.mtx th { padding: .3rem .45rem .5rem; text-align: center; border-bottom: none; font-size: .58rem; }
  table.mtx th.rowh { text-align: left; color: var(--text); font-size: .72rem; font-weight: 500; text-transform: none; letter-spacing: 0; padding-right: 1rem; }
  table.mtx td { padding: 0; border-bottom: none; text-align: center; white-space: nowrap; }
  table.mtx tr:hover td { background: transparent; }
  .mcell { border-radius: .45rem; padding: .5rem .3rem; font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.6rem; }
  .mcell.vazio { background: rgba(255,255,255,.025); color: var(--text-3); }
  .mcell.neutra { background: rgba(255,255,255,.05); color: var(--green); }
  .mcell.vazio2 { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  table.mtx th.agora { color: var(--orange); }
  table.mtx th.agora::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--orange); margin: .25rem auto 0; }
  table.mtx td.agora .mcell { outline: 1.5px solid rgba(224,90,26,.55); outline-offset: 1px; }
  table.mtx tr.destaque th.rowh { color: var(--orange); font-weight: 700; }
  table.mtx tr.destaque th.rowh { box-shadow: inset 3px 0 0 var(--orange); padding-left: .55rem; }
  table.mtx tr.oferta th.rowh { color: var(--text-3); font-weight: 400; padding-top: .6rem; }
  table.mtx tr.oferta td { padding-top: .5rem; }
  .mcell.ofer { padding: .3rem .3rem; }
  .pano-nota ul { margin: .2rem 0 0; padding-left: 1.1rem; display: grid; gap: .55rem; }
  .pano-nota li { font-size: .74rem; line-height: 1.55; color: var(--text-2); }
  .pano-nota li b { color: var(--text); font-weight: 600; }
  .pano-nota h4 { font-size: .72rem; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .06em; margin: 1.1rem 0 .4rem; }
  .pano-nota h4:first-child { margin-top: 0; }
  .pano-tab td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .mlegend .sw { width: 1.4rem; height: .7rem; border-radius: .2rem; }

  .ntag.medio { background: rgba(245,166,35,.12); color: #F5A623; border-color: rgba(245,166,35,.35); }

  a.src { color: var(--green); opacity:.8; }

                  padding-left: .95rem; position: relative; }

  .fontes-list { font-size: .7rem; color: var(--text-2); line-height: 1.9; }

     Sobrescreve o uso difuso de verde herdado do BI Limao. O verde fica

: 11.02 EUR, +0.16 EUR na semana, -3% vs média. Hass 22/24: 10.11 EUR, -0.31 EUR na semana, -5% vs média. Hass 26: 2.08 EUR/kg, -0.07 EUR na semana, -17% vs média. Histórico Hass 18: S36 11.57, S38 11.90, S39 11.70, S40 10.86, S41 10.86, S42 11.02."},{"titulo":"Origens – Destaques","texto":"Chile entra no pico de entregas, cerca de metade do volume total da semana. Peru, África do Sul e Quênia seguem perdendo força, com estoques finais de baixa qualidade. Colômbia estabiliza entregas, mercado difícil para calibres pequenos por causa do câmbio euro/peso. Israel começa a chegar com volume relevante pela primeira vez na temporada. Cotações por calibre: Colômbia 18 em 10.00/11.00 EUR/caixa, Quênia 18 em 8.00/9.00 EUR/caixa, Chile 26 em 2.15/2.50 EUR/kg, Peru 26 em 1.90/2.20 EUR/kg, Green Israel Ettinger 18 em 5.00/6.50 EUR/caixa."},{"titulo":"Estados Unidos","texto":"A edição desta semana não trouxe leitura aprofundada do mercado americano para o produtor brasileiro, além de registrar oferta mais apertada no México e preços estáveis em patamar baixo."},{"titulo":"Leitura para o Produtor Brasileiro","texto":"Calibres grandes (12/14 e 16/18) devem se recuperar rápido, com estoque antigo do Peru praticamente zerado. Calibres médio-pequenos e pequenos (22 a 32) seguem sob pressão, com mais oferta de todas as origens. Quem tem fruta graúda tem janela melhor agora. Fruta miúda só deve ganhar força se a demanda europeia reagir às promoções. Fique de olho no avanço de Israel e no pico do Chile, que vão disputar espaço direto com calibres médios brasileiros nas próximas semanas."}]},"newsletters":{"Brasil":{"titulo_pbi":"HASS | Brasil Overview","cambio":{"par":"USD/BRL","valor":5.06},"tabelas":[{"titulo":"Visão geral","colunas":["Data","Tag","Impacto","Descrição","Fonte"],"linhas":[{"data":"15/06/26","tag":"exportação","impacto":"Médio","texto":"As exportações de abacate do Brasil crescem mais de 400% em uma década. [exportação]","fonte":null},{"data":"15/06/26","tag":"exportaçã /* paginado de 1000 em 1000 via header Range — mesmo padrao do BI Limao */
async function sbFetch(tabela, params = {}){
  const PAGE = 1000;
  let todos = [], offset = 0;
  while(true){
    const url = new URL(SUPA_URL.replace(/\/$/,'') + '/rest/v1/' + tabela);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const r = await fetch(url, { headers: {
      apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON,
      'Range-Unit': 'items', Range: offset + '-' + (offset + PAGE - 1), Prefer: 'count=none'
    }});
    if(!r.ok){
      const corpo = await r.text().catch(()=> '');
      throw new Error(tabela + ': HTTP ' + r.status + ' — ' + corpo.slice(0,120));
    }
    const pag = await r.json();
    todos = todos.concat(pag);
    if(pag.length < PAGE) break;
    offset += PAGE;
  }
  return todos;
}

   Cada bloco tem try/catch proprio: se uma tabela falhar, as outras
   continuam vivas e so aquela cai no dado embutido. FONTES registra
   qual venceu, e a aba Fontes & Lacunas mostra isso. */
const FONTES = {};

const med = a => { if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1;
                   return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const mediaDe = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;

async function bloco(nome, fn){
  try { const n = await fn(); FONTES[nome] = {modo:'ao vivo', n}; return true; }
  catch(e){ console.warn('[supabase] '+nome+': '+e.message); FONTES[nome] = {modo:'embutido', erro:e.message}; return false; }
}

/* Chile, Argentina, Uruguai — a tabela cobre so 2026, entao MESCLA por ano
   com o que ja veio das planilhas (2023-2025) */
async function carregaOrigens(){
  const l = await sbFetch('v_precos_origem_semanal',
    {select:'pais,ano,semana,preco_max,preco_medio,dias', order:'pais.asc,ano.asc,semana.asc'});
  if(!l.length) throw new Error('tabela vazia');
  const mapa = {'Chile':'chile','Argentina':'argentina','Uruguai':'uruguai','Uruguay':'uruguai'};
  const porPais = {}, meta = {};
  l.forEach(r => {
    const k = mapa[r.pais]; if(!k) return;
    porPais[k] = porPais[k] || {};
    (porPais[k][String(r.ano)] = porPais[k][String(r.ano)]||[]).push({semana:+r.semana, valor:+r.preco_max});
    meta[k] = meta[k] || {dias:[], vies:[], em:null};
    if(r.dias!=null) meta[k].dias.push(+r.dias);
    // quanto o maximo da semana fica acima da media da semana. Nos anos que
    // vem de planilha a fonte traz UM preco por semana, entao la max===media:
    // esta diferenca e o degrau entre os dois tipos de fonte, medido, nao
    // estimado.
    if(r.preco_medio) meta[k].vies.push((+r.preco_max - +r.preco_medio)/+r.preco_medio*100);
  });
  Object.keys(porPais).forEach(k => {
    if(!DATA.precos[k]) return;
    const base = DATA.precos[k].series || {}, saida = Object.assign({}, base), mistos = [];
    Object.keys(porPais[k]).forEach(ano => {
      const vivo = porPais[k][ano], antigo = base[ano] || [];
      if(!antigo.length){ saida[ano] = vivo; return; }
      /* O coletor pode cobrir só PARTE de um ano — e vai cobrir, quando um
         backfill começar no meio (o acervo da UAM, por exemplo, começa em
         out/2024). Trocar o ano inteiro apagaria da tela as semanas que a
         planilha tem e o coletor não. Então a substituição é semana a semana:
         o coletor vence onde existe, a planilha fica onde ele não chega. */
      const porSem = {};
      antigo.forEach(x => porSem[x.semana] = x);
      vivo.forEach(x => porSem[x.semana] = x);
      saida[ano] = Object.keys(porSem).map(Number).sort((a,b)=>a-b).map(s => porSem[s]);
      if(vivo.length < saida[ano].length) mistos.push(ano + ' (' + vivo.length + '/' + saida[ano].length + ')');
    });
    DATA.precos[k].series = saida;
    DATA.precos[k].live = {
      anos: Object.keys(porPais[k]).sort(),
      mistos: mistos,
      dias: mediaDe(meta[k].dias),
      vies: mediaDe(meta[k].vies),
      vies_max: meta[k].vies.length ? Math.max.apply(null, meta[k].vies) : null,
      n: meta[k].dias.length
    };
  });
  return l.length;
}

/* Resumo executivo. O texto e escrito por modelo de linguagem a partir do
   boletim + dos numeros do banco (etl_cirad_resumo.py), entao a procedencia
   (modelo, metodo, conferencia de cifras) faz parte do dado e vai para a tela.
   A view v_cirad_resumo_atual ja devolve so a semana mais recente; se ela
   ainda nao existir no banco (schema v4 nao aplicado), cai na tabela e segue
   sem a procedencia em vez de deixar a aba vazia. */
async function carregaCirad(){
  const campos = 'ano,semana,ordem,secao,texto,arquivo,relatorio_semana,modelo,metodo,conferido,extracted_at';
  let desta = null, temMeta = true;
  try {
    desta = await sbFetch('v_cirad_resumo_atual', {select:campos, order:'ordem.asc'});
  } catch(e){
    console.warn('[supabase] v_cirad_resumo_atual indisponivel ('+e.message+') — usando cirad_resumo');
    temMeta = false;
    const l = await sbFetch('cirad_resumo',
      {select:'ano,semana,ordem,secao,texto,extracted_at', order:'ano.desc,semana.desc,ordem.asc'});
    if(!l.length) throw new Error('tabela vazia');
    desta = l.filter(r => r.ano===l[0].ano && r.semana===l[0].semana)
             .sort((a,b)=>a.ordem-b.ordem);
  }
  if(!desta || !desta.length) throw new Error('tabela vazia');
  const p = desta[0];
  SNAP.cirad = { titulo: SNAP.cirad.titulo, ano:p.ano, semana:p.semana,
    meta: { temMeta:temMeta, arquivo:p.arquivo||null,
            relatorio_semana:(p.relatorio_semana==null?null:+p.relatorio_semana),
            modelo:p.modelo||null, metodo:p.metodo||null,
            conferido:(p.conferido===true), em:p.extracted_at },
    secoes: desta.map(r => {
      const linhas = String(r.texto).split('\n').map(x=>x.trim()).filter(Boolean);
      const itens = linhas.filter(x => x.startsWith('-')).map(x => x.replace(/^-\s*/,''));
      const texto = linhas.filter(x => !x.startsWith('-')).join(' ');
      return itens.length ? {titulo:r.secao, texto:texto||null, itens} : {titulo:r.secao, texto};
    })};
  return desta.length;
}

/* Europa — CIRAD / FruiTrop. Ate 12/08/2026 esta aba era um PRINT do boletim
   colado no Power BI: nao havia serie, so a foto da semana. Agora vem de
   europa_cirad_precos, alimentada por etl_europa_cirad.py sobre os PDFs do
   boletim (2023-2026).
   ATENCAO a semana: e a do PRECO, nao a do relatorio — o boletim da S31
   publica o preco da S30. A view ja devolve a semana do preco. */
async function carregaEuropa(){
  const l = await sbFetch('v_europa_cirad_semanal',
    {select:'ano,semana,grade,preco,variacao_eur,variacao_media_pct,unidade,relatorio_semana,extracted_at',
     order:'ano.asc,semana.asc'});
  if(!l.length) throw new Error('tabela vazia');
  const num = v => v==null ? null : +v;
  // a serie do grafico e a caixa de 4kg; a grade 26 vem cotada em EUR/kg e
  // ficaria uma ordem de grandeza abaixo no mesmo eixo
  const caixa = l.filter(r => r.unidade === 'EUR/caixa 4kg');
  const serie = g => {
    const s = {};
    caixa.filter(r => r.grade === g).forEach(r =>
      (s[String(r.ano)] = s[String(r.ano)] || []).push({semana:+r.semana, valor:+r.preco}));
    Object.keys(s).forEach(a => s[a].sort((x,y)=>x.semana-y.semana));
    return s;
  };
  const hass = serie('Hass 18');
  if(!Object.keys(hass).length) throw new Error('sem Hass 18 na view');

  const h18 = caixa.filter(r => r.grade === 'Hass 18');

  const E = DATA.precos.europa;
  E.series = hass;
  E.green  = serie('Green 18');

  // Referencia e grade guardadas POR ANO: com o filtro de ano ligado, a caixa
  // de referencia tem que ser a da ultima semana daquele ano, nao a da ultima
  // semana do banco. `anterior` sai da lista global, para a variacao continuar
  // certa na virada de ano.
  const grades = (ano, sem) => l
    .filter(r => +r.ano === ano && +r.semana === sem)
    .map(r => ({grade:r.grade, preco:+r.preco, unidade:r.unidade,
                variacao_eur:num(r.variacao_eur), variacao_media_pct:num(r.variacao_media_pct)}))
    .sort((a,b) => a.grade.localeCompare(b.grade,'pt-BR'));

  E.ref_por_ano = {}; E.grades_por_ano = {};
  h18.forEach((r, i) => {
    const pen = i > 0 ? h18[i-1] : null;
    E.ref_por_ano[String(r.ano)] = {
      ano:+r.ano, semana:+r.semana, valor:+r.preco,
      variacao_eur:       num(r.variacao_eur),
      variacao_media_pct: num(r.variacao_media_pct),
      relatorio_semana:   num(r.relatorio_semana),
      anterior: pen ? {ano:+pen.ano, semana:+pen.semana, valor:+pen.preco} : null,
      em: r.extracted_at
    };
    E.grades_por_ano[String(r.ano)] = grades(+r.ano, +r.semana);
  });
  const ult = h18[h18.length-1];
  E.referencia = E.ref_por_ano[String(ult.ano)];
  E.grades     = E.grades_por_ano[String(ult.ano)];
  E.vivo = true;
  return l.length;
}

/* rotas: o dado bruto vem do banco e as matrizes/ranking/cards sao
   recalculados aqui — nao ha mais agregado pre-cozido no arquivo */
async function carregaRotas(){
  const l = await sbFetch('logistica_rotas',
    {select:'pais_origem,porto_origem,rota,pais_destino,porto_destino,modal,transit_time_dias,armador,obs,fonte',
     order:'pais_origem.asc'});
  if(!l.length) throw new Error('tabela vazia');
  const ehBrasil = r => r.pais_origem === 'Brasil';
  const glob = l.filter(r => !ehBrasil(r)), br = l.filter(ehBrasil);

  const rota = r => ({pais:r.pais_origem, porto_origem:r.porto_origem, rota:r.rota,
    pais_destino:r.pais_destino, porto_destino:r.porto_destino,
    transit_time: r.transit_time_dias==null?null:+r.transit_time_dias,
    fornecedor:r.armador, modal:r.modal, obs:r.obs});

  // cards sao dos cards do PBI: calculados so sobre as rotas GLOBAIS, nao
  // incluindo as de Santos (que tem secao propria)
  const tts = glob.map(r=>r.transit_time_dias).filter(v=>v!=null).map(Number);
  const G = {rotas: glob.map(rota), matriz:{paises_origem:[], paises_destino:[], valores:{}}, ranking:[],
             cards:{tt_menor: Math.min.apply(null,tts), tt_maior: Math.max.apply(null,tts),
                    tt_medio: +(mediaDe(tts)).toFixed(2)}};
  G.matriz.paises_origem  = Array.from(new Set(glob.map(r=>r.pais_origem))).sort();
  G.matriz.paises_destino = Array.from(new Set(glob.map(r=>r.pais_destino))).sort();
  G.matriz.paises_origem.forEach(o => {
    G.matriz.valores[o] = {};
    G.matriz.paises_destino.forEach(d => {
      const v = glob.filter(r=>r.pais_origem===o && r.pais_destino===d && r.transit_time_dias!=null)
                    .map(r=>+r.transit_time_dias);
      if(v.length) G.matriz.valores[o][d] = med(v);
    });
  });
  G.ranking = G.matriz.paises_origem.map(p => ({
      pais: p,
      portos: Array.from(new Set(glob.filter(r=>r.pais_origem===p).map(r=>r.porto_origem))).map(pt => ({
        porto: pt,
        tt: +(mediaDe(glob.filter(r=>r.pais_origem===p && r.porto_origem===pt && r.transit_time_dias!=null)
                          .map(r=>+r.transit_time_dias))).toFixed(2)
      })).sort((a,b)=>a.tt-b.tt)
    })).sort((a,b)=>a.portos[0].tt - b.portos[0].tt);

  const B = {rotas: br.map(rota), matriz:{}, ranking:[]};
  Array.from(new Set(br.map(r=>r.pais_destino))).forEach(d => {
    const v = br.filter(r=>r.pais_destino===d && r.transit_time_dias!=null).map(r=>+r.transit_time_dias);
    if(v.length) B.matriz[d] = +(mediaDe(v)).toFixed(2);
  });
  B.ranking = br.map(r => ({porto_origem:r.porto_origem, pais_destino:r.pais_destino,
    maritimo: (r.modal||'').indexOf('Rodov')===0 ? null : (r.transit_time_dias==null?null:+r.transit_time_dias),
    rodoviario: (r.modal||'').indexOf('Rodov')===0 ? (r.transit_time_dias==null?null:+r.transit_time_dias) : null}));

  DATA.logistica = {global:G, brasil:B};
  return l.length;
}

/* Clima: previsao diaria hoje..hoje+7 (Open-Meteo, etl_clima.py).
   Espelho das medidas do PBI: "Acumulado 7 dias (mm)" e "Descricao" (alerta >= 10 mm). */
async function carregaClima(){
  const l = await sbFetch('v_clima_previsao',
    {select:'data,pais,regiao,temp_max,temp_min,chuva_mm', order:'pais.asc,regiao.asc,data.asc'});
  if(!l.length) throw new Error('tabela vazia');
  const porPais = {};
  l.forEach(r => {
    const P = porPais[r.pais] = porPais[r.pais] || {dias:new Set(), reg:{}};
    P.dias.add(r.data);
    const R = P.reg[r.regiao] = P.reg[r.regiao] || {};
    R[r.data] = {tmax: r.temp_max==null?null:+r.temp_max, chuva: r.chuva_mm==null?0:+r.chuva_mm};
  });
  DATA.clima = {};
  Object.keys(porPais).forEach(p => {
    const P = porPais[p], dias = Array.from(P.dias).sort(), regs = Object.keys(P.reg).sort();
    const chuva7d = regs.map(g => {
      const mm = dias.reduce((a,d)=> a + ((P.reg[g][d]||{}).chuva||0), 0);
      return {cidade:g, acumulado_mm:+mm.toFixed(1), descricao: mm>=10 ? 'Chuva significativa prevista' : 'Sem chuva relevante'};
    }).sort((a,b)=>b.acumulado_mm-a.acumulado_mm);
    DATA.clima[p] = {vivo:true, dias, cidades:regs, chuva7d,
      serie: regs.map(g => ({regiao:g, tmax:dias.map(d=>(P.reg[g][d]||{}).tmax??null), chuva:dias.map(d=>(P.reg[g][d]||{}).chuva??null)}))};
  });
  return l.length;
}

/* Share Brasil: tabela comexstat (etl_comexstat.py, API do MDIC, NCM 0804.40.00).
   Mesma conta do DAX: Total Containers = CEILING(SUM(kg)/23760) NO NIVEL da agregacao
   (celula pais x mes, total do mes, total do pais), nao soma de celulas arredondadas. */
async function carregaComex(){
  const ano = new Date().getFullYear();
  let l = await sbFetch('comexstat', {select:'ano,mes,pais_destino,peso_kg', ano:'eq.'+ano});
  let a = ano;
  if(!l.length){ a = ano-1; l = await sbFetch('comexstat', {select:'ano,mes,pais_destino,peso_kg', ano:'eq.'+a}); }
  if(!l.length) throw new Error('tabela vazia');
  const ctn = kg => kg>0 ? Math.ceil(kg/23760) : 0;
  const meses = Array.from(new Set(l.map(r=>+r.mes))).sort((x,y)=>x-y);
  const kgPM = {}, kgM = {}, kgP = {};
  let kgT = 0;
  l.forEach(r => { const kg = +r.peso_kg||0, m = +r.mes, p = r.pais_destino;
    (kgPM[p] = kgPM[p]||{})[m] = ((kgPM[p]||{})[m]||0) + kg;
    kgM[m] = (kgM[m]||0) + kg; kgP[p] = (kgP[p]||0) + kg; kgT += kg; });
  const totM = {}; meses.forEach(m => totM[m] = ctn(kgM[m]));
  const totT = ctn(kgT);
  const paises = Object.keys(kgP).map(p => {
    const por_mes = {};
    meses.forEach(m => { const k = (kgPM[p]||{})[m];
      if(k!=null){ const c = ctn(k); por_mes[m] = {containers:c, pct: totM[m] ? +(c/totM[m]).toFixed(4) : null}; } });
    const c = ctn(kgP[p]);
    return {pais:p, por_mes, total:{containers:c, pct: totT ? +(c/totT).toFixed(4) : null}};
  }).sort((x,y)=>y.total.containers-x.total.containers);
  const total_geral = {por_mes:{}, total:{containers:totT, pct:1}};
  meses.forEach(m => total_geral.por_mes[m] = {containers:totM[m], pct:1});
  // DAX "% Mes Anterior": ultimo mes publicado contra o anterior, por pais
  const ult = meses[meses.length-1], ant = meses.length>1 ? meses[meses.length-2] : null;
  const pct_mes_anterior = ant==null ? [] : paises.map(p => {
      const c1 = ctn((kgPM[p.pais]||{})[ult]||0), c0 = ctn((kgPM[p.pais]||{})[ant]||0);
      return {pais:p.pais, v: c0 ? (c1-c0)/c0 : null};
    }).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v)
      .map(x=>({pais:x.pais, pct: Math.round(x.v*100)+'%'}));
  DATA.share = {vivo:true, ano:a, meses, paises, total_geral, pct_mes_anterior,
    periodo: MESA[meses[0]].toLowerCase()+' a '+MESA[ult].toLowerCase()+'/'+a, ult, ant};
  return l.length;
}

    // duas fontes na mesma serie: o ano corrente vem do coletor diario, os
    // anteriores de planilha. Dizer qual ano veio de onde e o minimo para o
    // grafico multi-ano nao ser lido como se fosse tudo a mesma medicao.
    // ano de projecao nao entra na ressalva do degrau maximo/media: comparar a
    // estatistica de uma curva construida com a de uma medicao nao diz nada.
    const proj = projecaoDe(key);
    const anosPlan = Object.keys(o.series||{})
      .filter(x => lv.anos.indexOf(x) < 0 && proj.indexOf(x) < 0).sort();
    const anosProj = Object.keys(o.series||{}).filter(x => proj.indexOf(x) >= 0).sort();
    partes.push('<b>Fonte:</b> ' + esc(m.fonteViva) + ' (' + lv.anos.join(', ') +
                '), via <code>v_precos_origem_semanal</code> no Supabase');
    if(anosPlan.length)
      partes.push(anosPlan.join(', ') + ' de ' + esc(fonte));
    else if(anosProj.length)
      partes.push(anosProj.join(', ') + ' de <code>Consolidado_forecast.xlsx</code> (proje&ccedil;&atilde;o)');
    partes.push('<b>Crit&eacute;rio:</b> m&aacute;ximo semanal do pre&ccedil;o m&eacute;dio di&aacute;rio' +
                (lv.dias!=null ? ' (' + nf(lv.dias,1) + ' dias cotados por semana)' : ''));
    if(lv.mistos && lv.mistos.length)
      partes.push('<b>Aten&ccedil;&atilde;o:</b> em ' + lv.mistos.join(', ') +
                  ' o coletor cobre s&oacute; parte das semanas do ano; o resto ficou da planilha');
    if(anosPlan.length && lv.vies!=null)
      partes.push('<b>Ressalva:</b> a planilha traz <b>um</b> pre&ccedil;o por semana, ent&atilde;o em ' +
                  anosPlan.join('/') + ' m&aacute;ximo e m&eacute;dia s&atilde;o o mesmo n&uacute;mero. ' +
                  'Medido em ' + lv.anos.join('/') + ', o m&aacute;ximo fica <b>' + nf(lv.vies,1) +
                  '%</b> acima da m&eacute;dia da semana (pico de ' + nf(lv.vies_max,1) + '%) &mdash; ' +
                  'esse degrau favorece o ano corrente na compara&ccedil;&atilde;o ano a ano');
  } else {
    partes.push('<b>Fonte:</b> ' + esc(fonte));
    partes.push('<b>Agrega&ccedil;&atilde;o:</b> ' + m.agg + ' do pre&ccedil;o por (ano, semana)');
  }
  partes.push('semana no padr&atilde;o WEEKNUM do Excel');
  if(RESSALVA_ORIGEM[key]) partes.push(RESSALVA_ORIGEM[key]);
  return partes.join(' &nbsp;&middot;&nbsp; ');
}

function corpoPreco(key){
  const m = ORIGENS.find(o=>o.key===key);
  if(key==='europa'){ $('precos-body').innerHTML = corpoEuropa(); chartEuropa(); return; }
  const o = DATA.precos[key], anos = anosDe(o);
  const sel = anoAtivo(key, anos);
  const anoAt = sel || ultimoAno(o), anosVis = sel ? [sel] : anos;
  const sAt = o.series[anoAt];
  const u4 = sel
    ? {origem:'serie', valores: sAt.slice(-4).map(x => ({ano:+sel, semana:x.semana, valor:x.valor}))}
    : ult4(key);
  const ultimo = sAt[sAt.length-1], penult = sAt[sAt.length-2];
  const d = penult ? (ultimo.valor-penult.valor)/penult.valor : null;
  const media = sAt.reduce((a,b)=>a+b.valor,0)/sAt.length;
  const max = sAt.reduce((a,b)=>b.valor>a.valor?b:a, sAt[0]);
  const min = sAt.reduce((a,b)=>b.valor<a.valor?b:a, sAt[0]);
  const fonte = (DATA.meta.fontes['precos.'+key]||[]).join(' + ');

  $('precos-body').innerHTML =
    '<div class="kpi-grid">'+
      kpi('Semana '+ultimo.semana+'/'+anoAt, m.moeda+'&nbsp;'+nf(ultimo.valor), m.unid, trendTag(d))+
      kpi('M&eacute;dia '+anoAt, m.moeda+'&nbsp;'+nf(media), m.unid)+
      kpi('M&aacute;ximo '+anoAt, m.moeda+'&nbsp;'+nf(max.valor), 'semana '+max.semana)+
      kpi('M&iacute;nimo '+anoAt, m.moeda+'&nbsp;'+nf(min.valor), 'semana '+min.semana)+
      (sel
        ? kpi('Filtrado', sel, 'de '+anos.length+' anos &middot; clique no ano para limpar')
        : kpi('Cobertura', anos.length+' anos', anos.join(' &middot; ')))+
    '</div>'+
    '<div class="col-1-2">'+
      chartCard('04 &uacute;ltimas semanas', 'chartU4', '<span class="badge">'+m.unid+'</span>',
        u4 && u4.origem==='pbi'
          ? 'Valores do export do Power BI (semana 24/2026) &mdash; as planilhas do projeto n&atilde;o t&ecirc;m '+m.label+' em 2026.'
          : 'Semanas mais recentes da s&eacute;rie, agrega&ccedil;&atilde;o '+m.agg+'.')+
      chartCard('M&eacute;dia hist&oacute;rica | KG', 'chartHist',
        chipsAno(key, anos, projecaoDe(key)),
        (projecaoDe(key).length
          ? 'A linha <b>tracejada</b> &eacute; proje&ccedil;&atilde;o (' + projecaoDe(key).join(', ') +
            '), n&atilde;o medi&ccedil;&atilde;o &mdash; ver a ressalva no p&eacute; da tabela. '
          : '') + NOTA_FILTRO, 'tall')+
    '</div>'+
    card('<div class="chart-header"><span class="chart-title">S&eacute;rie semanal'+
      (sel?' &middot; '+sel:'')+'</span><span class="badge">'+m.unid+'</span></div>'+
      '<div class="table-wrap scroll-y-lg">'+tblSerie(o, anosVis, m, projecaoDe(key))+'</div>'+
      '<div class="chart-note">'+notaFonte(key, m, fonte)+'</div>');

  mk('chartU4', {type:'bar', plugins:[barLabels], data:{
      labels: u4.valores.map(v=>[String(v.ano),'S'+v.semana]),
      datasets:[{data:u4.valores.map(v=>v.valor), backgroundColor:CORES_U4(u4.valores.length),
                 hoverBackgroundColor:HOVER_U4(u4.valores.length), borderRadius:4, maxBarThickness:46}]},
    options:{layout:{padding:{top:18}},
      plugins:{legend:{display:false}, barLabels:{prefix:m.moeda+' ', dec:2, destaque:u4.valores.length-1},
               tooltip:{callbacks:{label:c=>m.moeda+' '+nf(c.parsed.y)}}},
      scales:{x:{grid:NOGRID}, y:{grid:GRID, beginAtZero:true, ticks:{callback:v=>m.moeda+' '+v}}}}});

        const cor = ANO_COR[a]||PALETTE[anos.indexOf(a)%11];
        return {label:a + (ehProj?' (projeção)':''), data:semanas.map(s=>map[s]!=null?map[s]:null), spanGaps:true,

          borderWidth:a===anoAt?2.4:1.5, pointRadius:0, pointHoverRadius:4, tension:.3};})},
    options:{interaction:{mode:'index',intersect:false},

function tblSerie(o, anos, m, proj){
  proj = proj || [];
  const map={}; anos.forEach(a=>{ map[a]={}; o.series[a].forEach(x=>map[a][x.semana]=x.valor); });
  let h='<table class="table-mes"><thead><tr><th class="col-pais">Semana</th>'+
        anos.map((a,i)=>'<th class="col-num'+(i%2?' col-zebra':'')+'">'+a+
          (proj.indexOf(a)>=0?' <span class="badge">proj.</span>':'')+'</th>').join('')+'</tr></thead><tbody>';
  for(let s=1;s<=53;s++){
    if(!anos.some(a=>map[a][s]!=null)) continue;
    h+='<tr><td class="col-pais">S'+s+'</td>'+anos.map((a,i)=>
      '<td class="col-num'+(i%2?' col-zebra':'')+'">'+(map[a][s]!=null? m.moeda+' '+nf(map[a][s]) : '<span class="col-mes-vazio">—</span>')+'</td>').join('')+'</tr>';
  }
  return h+'</tbody></table>';
}

/* ── Europa ao vivo ────────────────────────────────────────────
   Reproduz as duas pecas que hoje sao PRINT no Power BI: a caixa de preco de
   referencia (na estrutura padrao de ultimas 4 semanas das outras origens) e
   o grafico historico multi-ano. Se a view nao responder, cai no snapshot
   antigo — que e literalmente a foto do boletim.
   O simbolo do euro aparece duas vezes: entidade HTML no DOM e caractere cru
   no canvas, porque Chart.js escreve texto em pixel e nao interpreta entidade. */
const EU_HTML = '&euro;', EU_TXT = '€';
const sgn = (v, dec, suf) => v==null ? '&mdash;'
  : (v>0?'+':(v<0?'−':'')) + nf(Math.abs(v), dec) + (suf||'');

function corpoEuropa(){
  const E = DATA.precos.europa;

  const anos = Object.keys(E.series).sort();

  const r = (sel && E.ref_por_ano && E.ref_por_ano[sel]) ? E.ref_por_ano[sel] : E.referencia;
  const anosVis = sel ? [sel] : anos;
  const gradesVis = (sel && E.grades_por_ano) ? (E.grades_por_ano[sel] || []) : E.grades;
  const sAt = E.series[String(r.ano)] || [];
  const media = mediaDe(sAt.map(x=>x.valor));
  const max = sAt.reduce((a,b)=>b.valor>a.valor?b:a, sAt[0]);
  const min = sAt.reduce((a,b)=>b.valor<a.valor?b:a, sAt[0]);
  const d = (r.anterior && r.anterior.valor) ? (r.valor-r.anterior.valor)/r.anterior.valor : null;
  const m = {moeda:EU_HTML, unid:EU_HTML+'/caixa 4kg', agg:'refer&ecirc;ncia CIRAD'};

    const s = E.series[a]; if(s.length<2) return false;
    return (s[s.length-1].semana - s[0].semana + 1) !== s.length;
  });

  return '<div class="kpi-grid">'+
      kpi('EU reference price', EU_HTML+'&nbsp;'+nf(r.valor),
          'Hass 18 &middot; semana '+r.semana+'/'+r.ano, trendTag(d))+
      kpi('M&eacute;dia '+r.ano, EU_HTML+'&nbsp;'+nf(media), m.unid)+
      kpi('M&aacute;ximo '+r.ano, EU_HTML+'&nbsp;'+nf(max.valor), 'semana '+max.semana)+
      kpi('M&iacute;nimo '+r.ano, EU_HTML+'&nbsp;'+nf(min.valor), 'semana '+min.semana)+
      (sel
        ? kpi('Filtrado', sel, 'de '+anos.length+' anos &middot; clique no ano para limpar')
        : kpi('Cobertura', anos.length+' anos', anos.join(' &middot; ')))+

    '<div class="col-1-2">'+
      chartCard('04 &uacute;ltimas semanas', 'chartEuU4', '<span class="badge">'+m.unid+'</span>',
        'Quatro semanas mais recentes publicadas pelo boletim. A semana &eacute; a do <b>pre&ccedil;o</b>'+
        (r.relatorio_semana!=null && r.relatorio_semana!==r.semana
          ? ', n&atilde;o a da edi&ccedil;&atilde;o: este pre&ccedil;o saiu no boletim da S'+r.relatorio_semana+'.'
          : '.'))+
      chartCard('M&eacute;dia hist&oacute;rica | caixa 4kg', 'chartEuHist',
        chipsAno('europa', anos),
        (buracos.length
          ? 'A linha de '+buracos.join(' e ')+' aparece <b>interrompida</b> onde o boletim n&atilde;o foi recuperado &mdash; a s&eacute;rie n&atilde;o &eacute; costurada por interpola&ccedil;&atilde;o. '
          : '') + NOTA_FILTRO, 'tall')+
    '</div>'+
    '<div class="col-2-1">'+
      card('<div class="chart-header"><span class="chart-title">S&eacute;rie semanal &middot; Hass 18'+
        (sel?' &middot; '+sel:'')+'</span><span class="badge">'+m.unid+'</span></div>'+
        '<div class="table-wrap scroll-y-lg">'+tblSerie({series:E.series}, anosVis, m)+'</div>'+
        '<div class="chart-note">'+notaFonteEuropa(E)+'</div>')+
      card('<div class="chart-header"><span class="chart-title">Caixa de refer&ecirc;ncia</span>'+
        '<span class="badge">semana '+r.semana+'/'+r.ano+'</span></div>'+
        '<div class="table-wrap">'+tblGradesEuropa(gradesVis)+'</div>'+
        '<div class="chart-note"><b>&Delta; semana</b> e <b>vs. m&eacute;dia</b> s&atilde;o os dois n&uacute;meros '+
        'que o pr&oacute;prio boletim imprime ao lado do pre&ccedil;o: varia&ccedil;&atilde;o em euro sobre a semana '+
        'anterior e varia&ccedil;&atilde;o percentual sobre a m&eacute;dia das duas safras anteriores. '+

              'Agora vêm de <code>europa_cirad_precos</code>, lida do PDF do boletim por <code>etl_europa_cirad.py</code>.', true))+

/* ══ RESUMO EXECUTIVO (CIRAD / Tropisens) ════════════════════
   No Power BI isto e pagina propria, alimentada por um TXT que o Tropisens.py
   sobrescrevia a cada execucao — existia so a ultima semana e nada dizia como
   o texto tinha sido produzido.
   Aqui vem de cirad_resumo. A procedencia esta na tela de proposito: este e o
   UNICO dado do projeto escrito por modelo de linguagem, e quem le precisa
   distinguir o que e boletim, o que e banco e o que e redacao. */
RENDER.resumo = function(){
  const c = SNAP.cirad || {}, meta = c.meta || {}, E = DATA.precos.europa || {};
  const secoes = c.secoes || [];
  if(!secoes.length){
    $('page-resumo').innerHTML =
      pageHeader('Mercados &middot; Boletim CIRAD / Tropisens', 'Resumo Executivo', '') +
      card(aviso('Nenhum resumo carregado. O texto vem da tabela <code>cirad_resumo</code>, '+
                 'alimentada por <code>etl_cirad_resumo.py</code> a cada boletim novo.'));
    return;
  }

  // A serie de preco e a mesma da aba Europa. Se o resumo for de uma semana
  // anterior ao ultimo preco publicado, isso e sinal de que o boletim novo
  // entrou e o resumo nao — vale dizer na cara, nao esconder.
  const serie = (E.series && E.series[String(c.ano)]) || [];
  const ponto = serie.filter(x => x.semana === c.semana)[0] || null;
  const ref   = (E.ref_por_ano && E.ref_por_ano[String(c.ano)]) || null;
  const ult   = E.referencia || null;
  const mesmaSemana = ult && ult.ano === c.ano && ult.semana === c.semana;
  const atrasado = ult && !mesmaSemana &&
    (ult.ano > c.ano || (ult.ano === c.ano && ult.semana > c.semana));

  const conclusao = secoes.filter(s => /produtor/i.test(s.titulo || ''));
  const corpo = secoes.filter(s => !/produtor/i.test(s.titulo || ''));

  const selo = meta.conferido
    ? aviso('<b>Cifras conferidas.</b> Todo pre&ccedil;o em euro citado neste resumo foi '+
            'encontrado em <code>europa_cirad_precos</code> / <code>europa_cirad_calibre</code> '+
            'da mesma semana. O ETL n&atilde;o grava resumo que cite valor fora do banco.', true)
    : aviso('<b>Sem conferência de cifras.</b> Este texto entrou antes da trava que '+

  const k = pais.toLowerCase().replace(/ô/g,'o').replace(/[^a-z]/g,'');

function corTT(v, mn, mx){
  const t = Math.max(0, Math.min(1, (v-mn)/((mx-mn)||1)));
  const S = TT_RAMP;                      // [rapido, medio, lento]
  const k = t < .5 ? 0 : 1, u = t < .5 ? t*2 : (t-.5)*2;
  const a = S[k], b = S[k+1];
  const mix = i => Math.round(a[i] + u*(b[i]-a[i]));
  return 'rgb('+mix(0)+','+mix(1)+','+mix(2)+')';
}

/* ══ PANORAMA MUNDIAL ════════════════════════════════════════
   Pedido da TFruits: todos os mercados lado a lado, por kg, mesma moeda.
   Semanal: as series da aba Precos convertidas para US$/kg. Mensal: preco de
   exportacao FOB/FOT (Comexstat para o Brasil, US Census para concorrentes).
   O FOB fica em bloco separado porque atacado nao vira FOB sem inventar
   custo: a nota de rodape explica isso para quem le. */
DATA.panorama = DATA.panorama || {fx:{}, fob:[]};

async function carregaPanorama(){
  const P = DATA.panorama = {fx:{}, fob:[]};
  let n = 0, erros = [];
  try {
    const fx = await sbFetch('v_cambio_atual', {select:'par,data,valor'});
    fx.forEach(r => P.fx[r.par] = {valor:+r.valor, data:r.data}); n += fx.length;
  } catch(e){ erros.push(e.message); }
  try {
    const fob = await sbFetch('v_fob_mensal',
      {select:'fonte,origem,destino,via,incoterm,ano,mes,peso_kg,valor_usd,usd_kg', order:'ano.asc,mes.asc'});
    P.fob = fob.map(r => ({fonte:r.fonte, origem:r.origem, destino:r.destino, via:r.via, incoterm:r.incoterm,
      ano:+r.ano, mes:+r.mes, peso_kg:+r.peso_kg, valor_usd:+r.valor_usd, usd_kg:+r.usd_kg}));
    n += fob.length;
  } catch(e){ erros.push(e.message); }
  try {
    const dst = await sbFetch('v_comexstat_mensal',
      {select:'ano,mes,pais_destino,peso_kg,valor_fob_usd', ano:'gte.'+(new Date().getFullYear()-1)});
    P.destino = dst.map(r => ({ano:+r.ano, mes:+r.mes, pais:r.pais_destino, kg:+r.peso_kg, usd:+r.valor_fob_usd}));
    n += dst.length;
  } catch(e){ erros.push(e.message); }
  if(!n) throw new Error(erros.join(' | ') || 'sem dados');
  return n;
}

/* Mercado da aba Precos -> paises de destino da exportacao brasileira.
   Europa = Uniao Europeia (o CIRAD cota o mercado europeu). */
const PANO_DESTINOS = {
  argentina: ['Argentina'], uruguai: ['Uruguai'], chile: ['Chile'],
  europa: ['Alemanha','Áustria','Bélgica','Bulgária','Chipre','Croácia','Dinamarca','Espanha','França','Grécia',
           'Irlanda','Itália','Letônia','Lituânia','Luxemburgo','Malta','Países Baixos (Holanda)','Polônia',
           'Portugal','Suécia','Tcheca, República']
};

/* FOB/FOT do Brasil para cada mercado: media ponderada dos ultimos 3 meses
   publicados (um mes so oscila demais em destino de pouco volume) */
function panoFobDestino(){
  const d = (DATA.panorama && DATA.panorama.destino) || [];
  if(!d.length) return {};
  const fim = Math.max.apply(null, d.map(r=>r.ano*12+r.mes-1)), ini = fim-2;
  const saida = {};
  Object.entries(PANO_DESTINOS).forEach(([k, paises]) => {
    const l = d.filter(r => paises.includes(r.pais) && (r.ano*12+r.mes-1) >= ini);
    const kg = l.reduce((a,r)=>a+r.kg,0), usd = l.reduce((a,r)=>a+r.usd,0);
    if(kg >= 1000) saida[k] = {usd_kg: usd/kg, t: kg/1000,
      periodo: MES_CURTO[ini%12]+' a '+MES_CURTO[fim%12]+'/'+String(Math.floor(fim/12)).slice(2)};
  });
  return saida;
}

const PANO_MERCADOS = [
  {key:'brasil',    label:'Brasil',    fonte:'Ceagesp (S&atilde;o Paulo)',          estagio:'atacado',    orig:'R$/kg',        moeda:'R$',     dec:2},
  {key:'chile',     label:'Chile',     fonte:'ODEPA (Santiago)',                     estagio:'atacado',    orig:'US$/kg',       moeda:'US$',    dec:2},

  {key:'uruguai',   label:'Uruguai',   fonte:'UAM (Montevid&eacute;u)',              estagio:'atacado',    orig:'US$/kg',       moeda:'US$',    dec:2},
  {key:'europa',    label:'Europa',    fonte:'CIRAD, Hass calibre 18',               estagio:'importacao', orig:'&euro;/caixa 4kg', moeda:'&euro;', dec:2},
];

function panoFx(){
  const fx = (DATA.panorama && DATA.panorama.fx) || {};
  const n = DATA.news || {};
  const brl = fx['USD/BRL'] || (n.brasil && n.brasil.cambio && {valor:n.brasil.cambio.valor, data:n.brasil.cambio.data});
  const eur = fx['USD/EUR'] || (n.espanha && n.espanha.cambio && {valor:n.espanha.cambio.valor, data:n.espanha.cambio.data});
  return {brl, eur};
}

/* ultimo ponto da serie e os pontos de 1 e 4 semanas antes (indice absoluto
   de semana, para atravessar a virada de ano) */
function panoPontos(series){
  const l = [];
  Object.keys(series||{}).forEach(a => (series[a]||[]).forEach(x => {
    if(x && x.valor!=null && !isNaN(x.valor)) l.push({ano:+a, semana:+x.semana, valor:+x.valor, ix:(+a)*53 + (+x.semana)});
  }));
  if(!l.length) return null;
  l.sort((x,y)=>x.ix-y.ix);
  const ult = l[l.length-1];
  const ate = alvo => { let m=null; l.forEach(x => { if(x.ix<=alvo && x.ix>=alvo-1) m=x; }); return m; };
  return {ult, s1:ate(ult.ix-1), s4:ate(ult.ix-4)};
}

function panoSemanal(){
  const fx = panoFx(), fd = panoFobDestino();
  return PANO_MERCADOS.map(m => {
    const o = DATA.precos[m.key]; if(!o) return null;
    const p = panoPontos(o.series); if(!p) return null;
    let usd = null;
    if(m.key==='brasil') usd = fx.brl ? p.ult.valor / fx.brl.valor : null;
    else if(m.key==='europa') usd = fx.eur ? (p.ult.valor/4) / fx.eur.valor : null;
    else usd = p.ult.valor;
    const d = b => b ? (p.ult.valor - b.valor)/b.valor : null;
    return Object.assign({}, m, {ult:p.ult, usd, d1:d(p.s1), d4:d(p.s4), fobBr:fd[m.key]||null});
  }).filter(Boolean);
}

const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const panoMes = r => MES_CURTO[r.mes-1]+'/'+String(r.ano).slice(2);
const panoDelta = d => d==null ? '<span style="color:var(--text-3)">&ndash;</span>'
  : '<span class="'+(d>=0?'pano-up':'pano-down')+'">'+(d>=0?'+':'')+nf(d*100,1)+'%</span>';

function panoFobSeries(){
  const fob = (DATA.panorama && DATA.panorama.fob) || [];
  const chave = r => r.fonte==='comexstat'
    ? (r.via==='TODAS' ? 'Brasil FOB (todas as vias)' : r.via==='RODOVIARIA' ? 'Brasil FOT (rodovi&aacute;rio)'
       : r.via==='MARITIMA' ? 'Brasil FOB mar&iacute;timo' : 'Brasil FOB a&eacute;reo')
    : r.origem+' FOB (embarques aos EUA)';
  const grupos = {};
  fob.forEach(r => { if(!r.usd_kg) return; const k = chave(r); (grupos[k] = grupos[k] || {k, r0:r, pontos:[]}).pontos.push(r); });
  Object.values(grupos).forEach(g => {
    g.pontos.sort((a,b)=>(a.ano*12+a.mes)-(b.ano*12+b.mes));
    g.ult = g.pontos[g.pontos.length-1];
    g.ant = g.pontos.length>1 ? g.pontos[g.pontos.length-2] : null;
    g.vol12 = g.pontos.slice(-12).reduce((a,x)=>a+x.peso_kg,0);
  });
  return grupos;
}

    '<li><b>Brasil:</b> Comexstat/MDIC, NCM 0804.40.00. Valor FOB declarado na exporta&ccedil;&atilde;o dividido pelo peso l&iacute;quido, m&ecirc;s a m&ecirc;s, separado por via. A via rodovi&aacute;ria &eacute; apresentada como FOT. O m&ecirc;s anterior &eacute; publicado por volta do dia 5. O c&oacute;digo NCM n&atilde;o separa variedades: o FOB do Brasil inclui Hass e abacate tropical, e as vendas de tropical a pa&iacute;ses vizinhos puxam a m&eacute;dia geral para baixo.</li>'+
    '<li><b>Concorrentes:</b> importa&ccedil;&otilde;es dos EUA de abacate Hass (US Census, HTS 0804.40.00.20 e .40) por pa&iacute;s de origem. O valor aduaneiro americano exclui frete, seguro e tarifas, ent&atilde;o equivale ao FOB que o exportador recebeu nos embarques para os EUA. Publica&ccedil;&atilde;o com cerca de 2 meses de defasagem.</li>'+
    '<li><b>Leitura.</b> O FOB &eacute; m&eacute;dia mensal ponderada por volume; o semanal &eacute; pre&ccedil;o de mercado. Use o FOB para tend&ecirc;ncia e posicionamento do Brasil frente aos concorrentes, n&atilde;o para comparar com a semana corrente. Meses com menos de 1 tonelada embarcada ficam de fora, porque uma remessa de amostra distorce a m&eacute;dia.</li></ul>'+
    '</div>', 'chart-card');

  $('page-panorama').innerHTML =
    pageHeader('Mercados &middot; Vis&atilde;o r&aacute;pida', 'Panorama Mundial',
      'Pre&ccedil;o de todos os mercados em US$/kg, na semana mais recente de cada fonte, e pre&ccedil;o de exporta&ccedil;&atilde;o FOB/FOT mensal.')+
    '<div class="kpi-grid">'+
      ord.map(x=>kpi(x.label, 'US$ '+nf(x.usd,2), 'por kg &middot; S'+x.ult.semana+'/'+x.ult.ano+'<br>'+PANO_ESTAGIO[x.estagio], x.d1==null ? null : '<span class="kpi-trend '+(x.d1>=0?'up':'down')+'">'+(x.d1>=0?'&uarr; ':'&darr; ')+nf(Math.abs(x.d1)*100,1)+'% na semana</span>', 'kpi-value-sm')).join('')+
    '</div>'+
    '<div class="region-title">Pre&ccedil;o semanal de mercado</div>'+
    '<div>'+
      chartCard('US$/kg: pre&ccedil;o no mercado e FOB/FOT do Brasil para ele', 'chartPanoSem', '<span class="badge">laranja = importa&ccedil;&atilde;o &middot; verde = atacado</span>')+
      card('<div class="chart-header"><span class="chart-title">Mercados lado a lado</span><span class="badge">'+sem.length+' mercados</span></div><div class="table-wrap">'+tabSem+'</div>', 'chart-card')+
    '</div>'+
    '<div class="region-title">Pre&ccedil;o de exporta&ccedil;&atilde;o (FOB / FOT, mensal)</div>'+
    (gl.length
      ? '<div class="kpi-grid">'+kFob('FOB Brasil &middot; todas as vias', bTodas)+kFob('FOB Brasil &middot; mar&iacute;timo', bMar)+
          kFob('FOB Brasil &middot; a&eacute;reo', bAer)+kFob('FOT Brasil &middot; rodovi&aacute;rio', bFot)+
          concorrentes.filter(g=>(fimCensus-(g.ult.ano*12+g.ult.mes))<=3).slice(0,4).map(g=>kFob('FOB '+esc(g.ult.origem)+' &middot; aos EUA', g.ult)).join('')+'</div>'+
        chartCard('FOB/FOT em US$/kg, &uacute;ltimos 12 meses', 'chartPanoFob', '<span class="badge">m&eacute;dia mensal ponderada</span>')+
        card('<div class="chart-header"><span class="chart-title">Pre&ccedil;o de exporta&ccedil;&atilde;o por origem</span></div><div class="table-wrap">'+tabFob+'</div>', 'chart-card')
      : card(vazio('Pre&ccedil;o de exporta&ccedil;&atilde;o ainda n&atilde;o carregado. Ele aparece depois da primeira rodada do ETL FOB/FOT.'), 'chart-card'))+
    nota;

  // grafico semanal: barras horizontais, cor pelo estagio
  mk('chartPanoSem', {type:'bar', plugins:[barLabels],
    data:{labels:ord.map(x=>x.label), datasets:[
      {label:'Pre\u00e7o no mercado', data:ord.map(x=>+x.usd.toFixed(2)),
       backgroundColor:ord.map(x=>PANO_COR[x.estagio]), borderRadius:6, maxBarThickness:30},
      {label:'FOB/FOT Brasil para o mercado (3 meses)', data:ord.map(x=>x.fobBr?+x.fobBr.usd_kg.toFixed(2):null),
       backgroundColor:'rgba(255,255,255,.28)', borderRadius:6, maxBarThickness:30}]},
    options:{indexAxis:'x', plugins:{legend:{display:true, position:'bottom'}, barLabels:{prefix:'', dec:2},
      tooltip:{callbacks:{label:c=>c.dataset.label+': US$ '+nf(c.parsed.y,2)+'/kg'}}},
      layout:{padding:{top:18}}, scales:{x:{grid:NOGRID}, y:{grid:GRID, beginAtZero:true, ticks:{callback:v=>'US$ '+v}}}}});

  // grafico FOB: 12 meses, Brasil + concorrentes com mais volume
  if(gl.length){
    const todos = gl.flatMap(g=>g.pontos.map(r=>r.ano*12+r.mes-1));
    const fim = Math.max.apply(null, todos), ini = fim - 11;
    const eixo = Array.from({length:12}, (_,i)=>ini+i);
    const rot = eixo.map(v=>MES_CURTO[v%12]+'/'+String(Math.floor(v/12)).slice(2));
    const escolha = ['Brasil FOB (todas as vias)','Brasil FOT (rodovi&aacute;rio)'].filter(k=>G[k])
      .concat(concorrentes.slice(0,5).map(g=>g.k));
    const txt = k => k.replace(/&aacute;/g,'á').replace(/&iacute;/g,'í').replace(/&eacute;/g,'é');
    mk('chartPanoFob', {type:'line',
      data:{labels:rot, datasets:escolha.map((k,i)=>{
        const m = {}; G[k].pontos.forEach(r=>m[r.ano*12+r.mes-1]=r.usd_kg);
        const cor = i===0 ? '#8DC63F' : i===1 ? '#C8E68A' : PALETTE[(i+1)%PALETTE.length];
        return {label:txt(k), data:eixo.map(v=>m[v]!=null?+m[v].toFixed(2):null), borderColor:cor, backgroundColor:cor,
          borderWidth:i<2?2.5:1.8, borderDash:i===1?[5,4]:[], pointRadius:2.5, tension:.3, spanGaps:false};
      })},
      options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': US$ '+nf(c.parsed.y,2)+'/kg'}}},
        scales:{x:{grid:NOGRID}, y:{grid:GRID, ticks:{callback:v=>'US$ '+v}}}}});
  }
};

/* ══ SHARE BRASIL ════════════════════════════════════════════ */
const MESN = {1:'Janeiro',2:'Fevereiro',3:'Mar&ccedil;o',4:'Abril',5:'Maio',6:'Junho',7:'Julho',8:'Agosto',9:'Setembro',10:'Outubro',11:'Novembro',12:'Dezembro'};
const MESA = {1:'Jan',2:'Fev',3:'Mar',4:'Abr',5:'Mai',6:'Jun',7:'Jul',8:'Ago',9:'Set',10:'Out',11:'Nov',12:'Dez'};

RENDER.share = function(){
  const S = DATA.share || SNAP.share_brasil, tg = S.total_geral;
  const per = S.vivo ? S.periodo : 'jan a mai/2026';
  const cel = (o,m) => o[m] || o[String(m)] || {};
  const top = S.paises.slice().filter(p=>p.total.containers).sort((a,b)=>b.total.containers-a.total.containers);
  const mesPico = S.meses.reduce((a,m)=> (cel(tg.por_mes,m).containers||0) > (cel(tg.por_mes,a).containers||0) ? m : a, S.meses[0]);

  let tbl = '<table class="table-mes"><thead><tr><th class="col-pais">Pa&iacute;s de destino</th>';
  S.meses.forEach((m,i)=>{ const z = i%2 ? ' col-zebra':'';
    tbl += '<th class="col-mes'+z+'">'+MESA[m]+' ctn</th><th class="col-mes'+z+(m%3===0?' col-tri':'')+'">%</th>'; });
  tbl += '<th class="col-total">Total ctn</th><th class="col-total">%</th></tr></thead><tbody>';
  S.paises.forEach((p,idx)=>{
    tbl += '<tr><td class="col-pais"><span class="pais-rank">'+(idx+1)+'</span>'+esc(p.pais)+'</td>';
    S.meses.forEach((m,i)=>{ const c = cel(p.por_mes,m), z = i%2?' col-zebra':'';
      tbl += '<td class="col-mes'+z+'">'+(c.containers!=null?ni(c.containers):'<span class="col-mes-vazio">—</span>')+'</td>';
      tbl += '<td class="col-mes'+z+(m%3===0?' col-tri':'')+'">'+(c.pct!=null?nf(c.pct,2):'<span class="col-mes-vazio">—</span>')+'</td>'; });
    tbl += '<td class="col-total">'+ni(p.total.containers)+'</td><td class="col-total">'+nf(p.total.pct,2)+'</td></tr>';
  });
  tbl += '</tbody><tfoot><tr><td class="col-pais">Total</td>';
  S.meses.forEach((m,i)=>{ const c = cel(tg.por_mes,m), z = i%2?' col-zebra':'';
    tbl += '<td class="col-mes'+z+'">'+ni(c.containers)+'</td><td class="col-mes'+z+(m%3===0?' col-tri':'')+'">'+nf(c.pct,2)+'</td>'; });
  tbl += '<td class="col-total">'+ni(tg.total.containers)+'</td><td class="col-total">'+nf(tg.total.pct,2)+'</td></tr></tfoot></table>';

  $('page-share').innerHTML =
    pageHeader('Log&iacute;stica &middot; Comexstat', 'Share Brasil',
               'Containers exportados por pa&iacute;s de destino e m&ecirc;s &mdash; '+per+'.')+
    '<div class="kpi-grid">'+
      kpi('Containers acumulados', ni(tg.total.containers), per)+
      kpi('Destinos ativos', String(top.length), 'de '+S.paises.length+' pa&iacute;ses na matriz')+
      kpi('Principal destino', esc(top[0].pais.replace(' (Holanda)','')), ni(top[0].total.containers)+' ctn &middot; '+nf(top[0].total.pct*100,0)+'%', null, 'kpi-value-sm')+
      kpi('M&ecirc;s de pico', MESN[mesPico], ni(cel(tg.por_mes,mesPico).containers)+' containers', null, 'kpi-value-sm')+
    '</div>'+
    '<div class="two-col">'+
      chartCard('Containers exportados por m&ecirc;s', 'chartShareMes', '<span class="badge">'+(S.ano||2026)+'</span>')+
      chartCard('Share por destino', 'chartShareDest', '<span class="badge">acumulado</span>')+
    '</div>'+
    card('<div class="chart-header"><span class="chart-title">Containers e % por pa&iacute;s de destino &times; m&ecirc;s</span></div>'+
      '<div class="table-wrap">'+tbl+'</div>', 'chart-card')+
    '<div class="two-col">'+
      card('<div class="chart-header"><span class="chart-title">% m&ecirc;s anterior</span>'+(S.vivo&&S.ant?'<span class="badge">'+MESA[S.ult]+' vs '+MESA[S.ant]+'</span>':'')+'</div>'+
        '<div class="table-wrap"><table class="table-compacta"><thead><tr><th>Pa&iacute;s</th><th style="text-align:right">% m&ecirc;s anterior</th></tr></thead><tbody>'+
        S.pct_mes_anterior.map(x=>'<tr><td style="color:var(--text);font-weight:500">'+esc(x.pais)+'</td><td style="text-align:right">'+esc(x.pct)+'</td></tr>').join('')+
        '</tbody></table></div>')+
      card('<div class="chart-header"><span class="chart-title">Origem do dado</span></div>'+
        (S.vivo
          ? '<div class="fontes-list">API p&uacute;blica do MDIC (Comexstat), exporta&ccedil;&atilde;o do NCM <b>0804.40.00</b> por pa&iacute;s de destino, coletada todo dia &uacute;til por <code>etl_comexstat.py</code>. Container = 23.760 kg l&iacute;quidos, arredondado para cima em cada n&iacute;vel, como a medida <code>Total Containers</code> do Power BI.</div>'
          : '<div class="fontes-list">Snapshot do export PDF do relat&oacute;rio (15/06/2026): a tabela <code>comexstat</code> n&atilde;o respondeu.</div>'+
            aviso('No export, a matriz e a tabela de % m&ecirc;s anterior aparecem <b>roladas</b>: apenas as linhas vis&iacute;veis foram capturadas.')))+
    '</div>';
  RENDER.shareCharts();
};

RENDER.shareCharts = function(){
  const S = DATA.share || SNAP.share_brasil, tg = S.total_geral;
  const cel = (o,m) => o[m] || o[String(m)] || {};
  mk('chartShareMes', {type:'bar', plugins:[barLabels], data:{labels:S.meses.map(m=>MESA[m]),
      datasets:[{data:S.meses.map(m=>cel(tg.por_mes,m).containers||0), backgroundColor:'#8DC63F', hoverBackgroundColor:'#A5D95C', borderRadius:4, maxBarThickness:48}]},
    options:{layout:{padding:{top:18}},
      plugins:{legend:{display:false}, barLabels:{dec:0}, tooltip:{callbacks:{label:c=>ni(c.parsed.y)+' containers'}}},

  const top = S.paises.slice().filter(p=>p.total.containers).sort((a,b)=>b.total.containers-a.total.containers).slice(0,8);

};

/* ══ INIT ════════════════════════════════════════════════════ */
function atualizaRodape(){
  const g = new Date(DATA.meta.gerado_em);
  const base = 'Dados de '+g.toLocaleDateString('pt-BR')+' · S'+semanaISO(g)+'/'+g.getFullYear();
  $('last-update').textContent = base + (FONTE_DADOS.modo === 'ao vivo' ? ' · ao vivo' : ' · embutido');
  $('last-update').title = FONTE_DADOS.detalhe;
}

async function init(){
  atualizaRodape();
  document.querySelectorAll('.nav-item,.mb-item').forEach(el=>el.addEventListener('click',()=>irPara(el.dataset.page)));
  RENDER.precos(); jaRenderizou.precos = true;

  // tenta o Supabase depois de pintar a tela: se responder, repinta com o dado vivo
  const vivo = await carregarSupabase();
  atualizaRodape();
  if(vivo){
    // invalida tudo e repinta so a aba visivel; as outras renderizam ao abrir
    Object.keys(jaRenderizou).forEach(k => jaRenderizou[k] = false);
    const ativa = document.querySelector('.page.active');
    const key = ativa ? ativa.id.replace('page-','') : 'precos';
    if(RENDER[key]){ RENDER[key](); jaRenderizou[key] = true; }
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
